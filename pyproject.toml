[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-ir"
version = "0.2.0"
description = "Canonical semantic intermediate representation for manufacturing systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Manufacturing IR" }]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "hypothesis>=6.100,<7",
  "pytest>=8,<9",
]
web = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
]

[project.scripts]
mir = "mir.cli:app"

[tool.setuptools.packages.find]
include = ["mir*"]

[tool.setuptools.package-data]
mir = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
